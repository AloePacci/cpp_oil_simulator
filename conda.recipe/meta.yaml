package:
  name: oilspillsim
  version: 0.1.0

source:
  path: ..

build:
  number: 0
  # conda-build builds without isolation: the PEP 517 backend (setuptools) must be a host requirement
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('cxx') }}

  host:
    - python
    - pip
    - setuptools >=42
    - wheel
    - pybind11 >=2.10.0

  run:
    - python
    - numpy


test:
  imports:
    - oilspillsim
  source_files:
    - tests
  commands:
    - python tests/test.py

about:
  summary: Oil spill particle simulator (C++ / pybind11) with dt-consistent physics and dynamic extensions.
  license_file: LICENSE
