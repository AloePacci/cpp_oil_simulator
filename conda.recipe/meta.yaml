package:
  name: oilspillsim
  version: 0.1.0

source:
  path: ..

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv

requirements:
  build:
    - {{ compiler('cxx') }}

  host:
    - python
    - pip
    - pybind11 >=2.10.0

  run:
    - python
    - numpy


test:
  imports:
    - oilspillsim
  source_files:
    - tests
  commands:
    - python tests/test.py

about:
  summary: Oil spill particle simulator (C++ / pybind11) with dt-consistent physics and dynamic extensions.
  license_file: LICENSE
