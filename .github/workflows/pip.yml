name: Pip

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            python-version: "3.7"
          - platform: windows-latest
            python-version: "3.11"
          # macos-13 runners were retired (jobs stay queued); macos-latest is arm64 (no Python 3.7 there)
          - platform: macos-latest
            python-version: "3.9"
          - platform: macos-latest
            python-version: "3.12"
          - platform: ubuntu-latest
            python-version: "3.11"


    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    # Install Eigen
    - name: Install Eigen (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

    - name: Install Eigen (macOS)
      if: runner.os == 'macOS'
      run: brew install eigen

    - name: Add requirements
      run: python -m pip install --upgrade --break-system-packages wheel setuptools

    - name: Build and install
      run: pip install --break-system-packages --verbose . 

    - name: Test
      run: python tests/test.py

  build-mingw64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64          # MINGW64 is deprecated by setup-msys2
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-python-pip
          mingw-w64-ucrt-x86_64-python-wheel
          mingw-w64-ucrt-x86_64-python-numpy

    - uses: actions/checkout@v5

    - name: Install pybind11
      # This is required because --no-build-isolation disable dependences
      # installation
      run: pip install --break-system-packages pybind11 cython

    - name: Install mesonpy
      run: pacman -S --noconfirm mingw-w64-ucrt-x86_64-meson-python

    - name: Build and install
      # --no-build-isolation is required because the vanilla setuptool does not
      # support Mingw64.See patches here:
      # https://github.com/msys2/MINGW-packages/tree/master/mingw-w64-python-setuptools
      # Without those patches build_ext fails with:
      # error: --plat-name must be one of ('win32', 'win-amd64', 'win-arm32', 'win-arm64')
      run: pip install --no-build-isolation --break-system-packages .

    - name: Test
      run: python tests/test.py
