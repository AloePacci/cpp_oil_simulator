name: Conda

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 runners were retired by GitHub (jobs stay queued forever); macos-latest is arm64
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    runs-on: ${{ matrix.platform }}

    # The setup-miniconda action needs this to activate miniconda
    defaults:
      run:
        shell: "bash -l {0}"

    steps:
      - uses: actions/checkout@v5

      - name: Get conda
        uses: conda-incubator/setup-miniconda@v3.2.0
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          conda-remove-defaults: "true"     # silences the implicit 'defaults' channel warning

      - name: Prepare
        # `conda build` is a plugin of the BASE environment: installing conda-build into the activated test env
        # gives "conda: error: argument COMMAND: invalid choice: 'build'". conda-verify is deprecated.
        run: conda install -n base -y conda-build

      - name: Install Eigen
        run: conda install -c conda-forge eigen

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Remove Git for Windows from PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "##[group]Fix PATH"
          echo "PATH before: $PATH"
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/bin' | paste -sd ':' -)
          echo "PATH after: $PATH"
          echo "##[endgroup]"
          conda build conda.recipe

      - name: Build
        if: runner.os != 'Windows'
        run: conda build conda.recipe

      - name: Install
        run: conda install -c ${CONDA_PREFIX}/conda-bld/ oilspillsim

      - name: Test
        run: python tests/test.py
