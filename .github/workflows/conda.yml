name: Conda

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 runners were retired by GitHub (jobs stay queued forever); macos-latest is arm64
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    runs-on: ${{ matrix.platform }}

    # The setup-miniconda action needs this to activate miniconda
    defaults:
      run:
        shell: "bash -l {0}"

    steps:
      - uses: actions/checkout@v5

      - name: Get conda
        uses: conda-incubator/setup-miniconda@v3.2.0
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          conda-remove-defaults: "true"     # silences the implicit 'defaults' channel warning

      - name: Prepare
        # `conda build` is a plugin of the BASE environment: installing conda-build into the activated test env
        # gives "conda: error: argument COMMAND: invalid choice: 'build'". conda-verify is deprecated.
        run: conda install -n base -y conda-build

      - name: Install Eigen
        run: conda install -c conda-forge eigen

      # No "Setup MSVC" step here: conda-build activates MSVC itself ({{ compiler('cxx') }} -> vcvars64.bat). Running
      # ilammy/msvc-dev-cmd first doubled PATH / INCLUDE / LIB and cmd.exe failed with "The input line is too long".
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          # minimal environment for cmd.exe / vcvars64.bat: the runner PATH alone is several thousand characters
          C=$(cygpath -u "$CONDA")
          export PATH="$C/condabin:$C/Scripts:$C/Library/bin:$C:/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0"
          unset INCLUDE LIB LIBPATH
          conda build conda.recipe --python ${{ matrix.python-version }} --output-folder conda-out

      - name: Build
        if: runner.os != 'Windows'
        run: conda build conda.recipe --python ${{ matrix.python-version }} --output-folder conda-out

      - name: Install
        # --python above: conda-build runs from base (its own Python, e.g. 3.14) and would otherwise build for that version
        # conda-build lives in base, so the package is NOT in ${CONDA_PREFIX}/conda-bld of the test env: build into a
        # fixed folder of the workspace (conda-build indexes it, so it is a valid local channel) and install from there
        run: conda install -y -c ./conda-out oilspillsim

      - name: Test
        run: python tests/test.py
